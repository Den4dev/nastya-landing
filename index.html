    .intro-text .w:nth-child(4){animation-delay:2.3s;}

  @keyframes introWord{to{opacity:1; transform:none; filter:none;}}
  @keyframes introOut{to{opacity:0; visibility:hidden;}}

  .hero-actions{display:flex; flex-wrap:wrap; gap:clamp(12px,.9vw,22px);}
  .hero-btn{display:inline-flex; align-items:center; gap:1.1em;
    height:clamp(58px,4.9vw,120px); padding:0 clamp(24px,2.7vw,70px);
    border-radius:clamp(18px,1.6vw,40px); color:#fff; font-family:'Inter',sans-serif;
    font-weight:600; font-size:clamp(17px,1.45vw,34px); white-space:nowrap;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);}
  .hero-btn:hover{transform:translateY(-2px);}
  .hero-btn .ico{width:1.7em; height:1.7em; flex:none;}
  .hero-btn .arr{width:1.2em; height:1.2em; flex:none; margin-left:auto; padding-left:0; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  .hero-btn-tg{background:linear-gradient(180deg,#BC735A,#AE6246); box-shadow:0 18px 40px -14px rgba(174,98,70,.6); min-width:clamp(0px,24vw,640px);}
  .hero-btn-max{background:#2A2220; box-shadow:0 18px 40px -14px rgba(30,22,20,.5); min-width:clamp(0px,25.5vw,680px);}

  .hero-feats{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(10px,.7vw,18px);}
  .hero-feat{display:flex; align-items:center; gap:clamp(12px,1.1vw,28px);
    background:rgba(255,250,245,.93); border-radius:clamp(20px,1.6vw,40px);
    padding:clamp(14px,1.1vw,28px) clamp(14px,1.2vw,30px);
    box-shadow:0 14px 40px -24px rgba(90,60,40,.35);}
  .hero-feat-ico{width:clamp(48px,3.8vw,96px); height:clamp(48px,3.8vw,96px); flex:none;
    border-radius:50%; background:rgba(194,122,92,.14); display:flex; align-items:center; justify-content:center;}
  .hero-feat-ico svg{width:46%; height:46%; fill:none; stroke:var(--accent); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .hero-feat h3{font-family:'Inter',sans-serif; font-size:clamp(16px,1.1vw,26px); font-weight:700; line-height:1.2; margin-bottom:.4em; color:#1D1613; letter-spacing:-.01em;}
  .hero-feat p{font-size:clamp(13px,.88vw,20px); line-height:1.4; color:#7a685c;}

  @media (max-width:1100px){
    .hero-feats{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:920px){
    .wrap.wrap-full{padding-inline:20px;}
    .hero{padding-top:96px;}
    .hero-media{display:none;}
    .hero-inner{padding-top:8px;}
    .hero-media-label{right:50%; transform:translateX(50%); top:52%;}
    .hero h1{font-size:clamp(38px,11.5vw,72px);}
    .hero p.lead br{display:none;}
    .hero{--accent:#B36B4D;}
    .hero h1{color:#1D1613;text-shadow:none;}
    .hero p.lead{color:#7a685c;text-shadow:none;}
    .hero-actions{flex-direction:column;}
    .hero-btn{width:100%; min-width:0 !important;}
    .nav-links{display:none;}
    .bg-photo,.bg-dots,.bg-blob-mid{display:none;}
    .hero-pill{align-self:center;}
    .hero h1,.hero p.lead{text-align:center;}
    .hero p.lead{margin-inline:auto;}
    .hero-actions{justify-content:center;}
  }
  @media (max-width:560px){
    .hero-feats{grid-template-columns:1fr;}
  }

  /* Низкие экраны (ПК): ужимаем размеры по высоте окна, чтобы первый экран помещался целиком */
  @media (min-width:921px){
    .hero{padding-top:clamp(84px, min(5.9vw, 11vh), 160px); padding-bottom:clamp(12px, min(1.2vw, 2vh), 30px);}
    .hero h1{font-size:clamp(40px, min(5.3vw, 10.4vh), 150px);}
    .hero p.lead{font-size:clamp(16px, min(1.35vw, 2.7vh), 34px); margin-bottom:clamp(16px, min(1.7vw, 3vh), 44px);}
    .hero-btn{height:clamp(52px, min(4.9vw, 9vh), 120px);}
    .hero-inner{gap:clamp(14px, min(1.8vw, 3vh), 44px);}
    .hero-feat{padding:clamp(12px, min(1.1vw, 2vh), 28px) clamp(14px, 1.2vw, 30px);}
  }

  /* ==============================================================
     НОВЫЙ ДИЗАЙН ВСЕХ БЛОКОВ НИЖЕ HERO (В СТИЛЕ ГЛАВНОЙ)
     ============================================================== */
  section:not(.hero){
    padding:clamp(60px, 6.5vw, 110px) 0;
  }

  /* Заголовки секций и пилюли в стиле .hero-pill и .hero h1 */
  .section-head{
    max-width:780px;
    margin-bottom:clamp(36px, 4vw, 64px);
  }
  .section-head.center{
    text-align:center;
    margin-left:auto;
    margin-right:auto;
  }
  .section-head .tag,
  .about-text .tag{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Inter',sans-serif;
    font-size:clamp(12px, 0.9vw, 15px);
    font-weight:600;
    color:var(--text);
    background:rgba(255,250,245,0.88);
    border:1px solid rgba(45,36,32,0.08);
    padding:10px 20px;
    border-radius:999px;
    margin-bottom:clamp(16px, 1.5vw, 24px);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 24px -10px rgba(90,60,40,0.18);
    text-transform:none;
    letter-spacing:-0.01em;
  }
  .section-head .tag::before,
  .about-text .tag::before{
    content:'';
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--primary);
    box-shadow:0 0 0 4px rgba(194,122,92,0.2);
  }
  .section-head h2{
    font-family:'Inter','Manrope',sans-serif;
    font-size:clamp(32px, 3.8vw, 62px);
    font-weight:800;
    line-height:1.02;
    letter-spacing:-0.04em;
    color:var(--text);
    text-shadow:0 2px 24px rgba(251,246,242,0.9);
  }

  /* ---------- About (Познакомимся) ---------- */
  .about-grid{
    display:grid;
    grid-template-columns:1.2fr 0.8fr;
    gap:clamp(36px, 5vw, 80px);
    align-items:center;
    background:var(--surface);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:clamp(28px, 2.6vw, 48px);
    padding:clamp(36px, 4.8vw, 76px);
    border:1px solid rgba(255,255,255,0.85);
    box-shadow:var(--surface-shadow);
    position:relative;
    overflow:hidden;
  }
  /* Мягкий тёплый градиентный шар внутри карточки, перекликающийся с Hero */
  .about-grid::before{
    content:'';
    position:absolute;
    right:-10%;
    top:-20%;
    width:520px;
    height:520px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(232,160,127,0.22) 0%, transparent 68%);
    pointer-events:none;
    z-index:0;
  }
  .about-text{
    position:relative;
    z-index:1;
  }
  .about-text h2{
    font-family:'Inter','Manrope',sans-serif;
    font-size:clamp(30px, 3.4vw, 54px);
    font-weight:800;
    line-height:1.04;
    letter-spacing:-0.04em;
    margin-bottom:clamp(18px, 1.8vw, 28px);
    color:var(--text);
  }
  .about-text p{
    color:var(--text-secondary);
    font-size:clamp(16px, 1.25vw, 22px);
    line-height:1.6;
    font-weight:400;
    max-width:38em;
  }
  .about-photo-wrap{
    display:flex;
    justify-content:center;
    position:relative;
    z-index:1;
  }
  .about-photo-wrap::before{
    content:'';
    position:absolute;
    inset:-16px;
    margin:auto;
    width:calc(clamp(260px, 24vw, 360px) + 28px);
    height:calc(clamp(260px, 24vw, 360px) + 28px);
    border-radius:50%;
    border:1.5px dashed rgba(194,122,92,0.35);
    pointer-events:none;
  }
  .about-photo-wrap .photo{
    box-shadow:0 28px 64px -18px rgba(138,78,52,0.4);
    border:8px solid rgba(255,255,255,0.92);
    transition:transform .5s var(--ease);
  }
  .about-grid:hover .about-photo-wrap .photo{
    transform:scale(1.02);
  }

  /* ---------- Features (Возможности — в стиле .hero-feat) ---------- */
  .cards3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(18px, 1.8vw, 30px);
  }
  .card{
    background:var(--surface);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:var(--radius-lg);
    padding:clamp(30px, 3vw, 48px);
    border:1px solid rgba(255,255,255,0.85);
    box-shadow:var(--surface-shadow);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    transition:transform .4s var(--ease), box-shadow .4s var(--ease), background .4s var(--ease), border-color .4s var(--ease);
  }
  .card::before{
    content:'';
    position:absolute;
    top:0;right:0;
    width:200px;height:200px;
    background:radial-gradient(circle at top right, rgba(232,160,127,0.18), transparent 70%);
    pointer-events:none;
  }
  .card:hover{
    transform:translateY(-8px);
    background:var(--surface-hover);
    box-shadow:var(--surface-shadow-hover);
    border-color:rgba(194,122,92,0.3);
  }
  .card-icon{
    width:clamp(60px, 4.4vw, 76px);
    height:clamp(60px, 4.4vw, 76px);
    border-radius:50%;
    background:rgba(194,122,92,0.14);
    border:1px solid rgba(194,122,92,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(26px, 2vw, 34px);
    margin-bottom:clamp(22px, 2vw, 32px);
    transition:transform .4s var(--ease), background .4s var(--ease);
  }
  .card:hover .card-icon{
    transform:scale(1.08) rotate(-4deg);
    background:rgba(194,122,92,0.22);
  }
  .card h3{
    font-family:'Inter',sans-serif;
    font-size:clamp(20px, 1.5vw, 26px);
    font-weight:700;
    letter-spacing:-0.02em;
    line-height:1.2;
    margin-bottom:12px;
    color:var(--text);
  }
  .card p{
    color:var(--text-secondary);
    font-size:clamp(15px, 1.05vw, 18px);
    line-height:1.55;
  }
  .modes{
    display:flex;
    gap:8px;
    margin-top:auto;
    padding-top:24px;
    flex-wrap:wrap;
  }
  .mode-pill{
    font-size:clamp(12.5px, 0.85vw, 14.5px);
    font-weight:600;
    padding:8px 16px;
    border-radius:999px;
    background:rgba(45,36,32,0.05);
    border:1px solid rgba(45,36,32,0.06);
    color:var(--text-secondary);
    transition:all .25s var(--ease);
  }
  .mode-pill.active{
    background:linear-gradient(180deg,#BC735A,#AE6246);
    color:#fff;
    border-color:transparent;
    box-shadow:0 8px 20px -6px rgba(174,98,70,0.5);
  }

  /* ---------- Why (Почему это удобно — Bento-плитки как .hero-feat) ---------- */
  .why{
    background:transparent;
    border:none;
    padding:0;
  }
  .why-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(14px, 1.4vw, 24px);
  }
  .why-item{
    display:flex;
    align-items:center;
    gap:clamp(14px, 1.2vw, 22px);
    background:var(--surface);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.85);
    border-radius:clamp(20px, 1.6vw, 32px);
    padding:clamp(20px, 1.8vw, 30px) clamp(20px, 2vw, 32px);
    box-shadow:var(--surface-shadow);
    font-family:'Inter',sans-serif;
    font-size:clamp(16px, 1.15vw, 20px);
    font-weight:700;
    letter-spacing:-0.015em;
    color:var(--text);
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease), border-color .35s var(--ease);
  }
  .why-item:hover{
    transform:translateY(-5px);
    background:var(--surface-hover);
    box-shadow:var(--surface-shadow-hover);
    border-color:rgba(194,122,92,0.28);
  }
  .why-check{
    width:clamp(42px, 3vw, 54px);
    height:clamp(42px, 3vw, 54px);
    border-radius:50%;
    background:rgba(194,122,92,0.14);
    color:var(--primary-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size:clamp(16px, 1.2vw, 20px);
    font-weight:800;
    transition:background .3s var(--ease), color .3s var(--ease), transform .3s var(--ease);
  }
  .why-item:hover .why-check{
    background:var(--primary);
    color:#fff;
    transform:scale(1.06);
  }

  /* ---------- Reviews (Отзывы — журнальные карточки без белой простыни) ---------- */
  .reviews-bg{
    background:transparent;
    padding:0;
  }
  .reviews-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(18px, 1.8vw, 30px);
    max-width:none;
    margin:0;
  }
  .review-card{
    background:var(--surface);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:var(--radius-lg);
    padding:clamp(30px, 2.8vw, 44px);
    border:1px solid rgba(255,255,255,0.85);
    box-shadow:var(--surface-shadow);
    display:flex;
    flex-direction:column;
    gap:22px;
    position:relative;
    overflow:hidden;
    transition:transform .4s var(--ease), box-shadow .4s var(--ease), background .4s var(--ease), border-color .4s var(--ease);
  }
  .review-card::after{
    content:'“';
    position:absolute;
    top:12px;
    right:26px;
    font-family:'Manrope',sans-serif;
    font-size:110px;
    font-weight:800;
    line-height:1;
    color:rgba(194,122,92,0.10);
    pointer-events:none;
  }
  .review-card:hover{
    transform:translateY(-8px);
    background:var(--surface-hover);
    box-shadow:var(--surface-shadow-hover);
    border-color:rgba(194,122,92,0.3);
  }
  .review-stars{
    color:#E59A38;
    font-size:15px;
    letter-spacing:3px;
    background:rgba(229,154,56,0.12);
    border:1px solid rgba(229,154,56,0.22);
    padding:7px 14px;
    border-radius:999px;
    width:fit-content;
  }
  .review-text{
    font-size:clamp(16px, 1.1vw, 19px);
    line-height:1.62;
    color:var(--text);
    font-weight:500;
    letter-spacing:-0.01em;
    flex:1;
    position:relative;
    z-index:1;
  }
  .review-footer{
    display:flex;
    align-items:center;
    gap:14px;
    padding-top:20px;
    border-top:1px solid rgba(45,36,32,0.08);
  }
  .tg-av{
    width:48px;height:48px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:800;
    font-family:'Inter',sans-serif;
    color:#fff;
    box-shadow:0 8px 18px -6px rgba(45,36,32,0.25);
  }
  .tg-av.a{background:linear-gradient(135deg,var(--primary),#E8B4A0);}
  .tg-av.d{background:linear-gradient(135deg,#4A90D9,#6BB0F5);}
  .tg-av.m{background:linear-gradient(135deg,#7B68EE,#9F8FFF);}
  .tg-av.s{background:linear-gradient(135deg,#E07A5F,#F2A68D);}
  .review-name{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:var(--text);
  }
  .review-date{
    font-size:13.5px;
    color:var(--text-secondary);
    margin-top:2px;
  }

  /* ---------- How it works (Как начать разговор — крупные шаги с водяными цифрами) ---------- */
  .steps{
    display:grid;
    grid-template-columns:1fr auto 1fr auto 1fr;
    align-items:stretch;
    gap:clamp(12px, 1.2vw, 20px);
  }
  .step{
    background:var(--surface);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.85);
    border-radius:var(--radius-lg);
    padding:clamp(30px, 3vw, 46px);
    box-shadow:var(--surface-shadow);
    text-align:left;
    position:relative;
    overflow:hidden;
    transition:transform .4s var(--ease), box-shadow .4s var(--ease), background .4s var(--ease), border-color .4s var(--ease);
  }
  .step:hover{
    transform:translateY(-8px);
    background:var(--surface-hover);
    box-shadow:var(--surface-shadow-hover);
    border-color:rgba(194,122,92,0.3);
  }
  .step-num{
    font-family:'Inter',sans-serif;
    font-size:clamp(18px, 1.3vw, 22px);
    font-weight:800;
    color:#fff;
    background:linear-gradient(180deg,#BC735A,#AE6246);
    width:clamp(46px, 3.4vw, 56px);
    height:clamp(46px, 3.4vw, 56px);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:clamp(20px, 2vw, 28px);
    box-shadow:0 12px 24px -8px rgba(174,98,70,0.55);
  }
  .step h3{
    font-family:'Inter',sans-serif;
    font-size:clamp(20px, 1.45vw, 25px);
    font-weight:700;
    letter-spacing:-0.02em;
    margin-bottom:10px;
    color:var(--text);
  }
  .step p{
    font-size:clamp(15px, 1.05vw, 18px);
    line-height:1.55;
    color:var(--text-secondary);
  }
  .step-arrow{
    align-self:center;
    width:46px;
    height:46px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid rgba(45,36,32,0.08);
    box-shadow:0 10px 24px -8px rgba(90,60,40,0.2);
    color:var(--primary-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:700;
    flex-shrink:0;
  }

  /* ---------- Pro (Кинематографичный тёмный блок в тонах Hero-градиента) ---------- */
  .pro{
    background:linear-gradient(135deg,#1D1410 0%,#2C1E18 52%,#3D2920 100%);
    border-radius:clamp(28px, 2.8vw, 48px);
    padding:clamp(36px, 5vw, 76px);
    color:#fff;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 36px 90px -24px rgba(29,20,16,0.6);
  }
  .pro::before{
    content:'';
    position:absolute;
    top:-160px; right:-120px;
    width:560px;height:560px;
    background:radial-gradient(circle, rgba(232,160,127,0.32), transparent 68%);
    pointer-events:none;
  }
  .pro::after{
    content:'';
    position:absolute;
    bottom:-180px; left:-120px;
    width:500px;height:500px;
    background:radial-gradient(circle, rgba(194,122,92,0.2), transparent 70%);
    pointer-events:none;
  }
  .pro-grid{
    display:grid;
    grid-template-columns:1.25fr 0.75fr;
    gap:clamp(32px, 4vw, 64px);
    align-items:center;
    position:relative;
    z-index:1;
    padding-bottom:clamp(36px, 4vw, 56px);
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .pro-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#F7E5DC;
    background:rgba(232,160,127,0.18);
    border:1px solid rgba(232,160,127,0.38);
    padding:9px 18px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .pro-badge::before{
    content:'✦';
    color:#E8A07F;
  }
  .pro h2{
    font-family:'Inter','Manrope',sans-serif;
    font-size:clamp(30px, 3.4vw, 52px);
    font-weight:800;
    line-height:1.05;
    letter-spacing:-0.035em;
    margin-bottom:18px;
  }
  .pro p.desc{
    color:rgba(255,250,245,0.78);
    font-size:clamp(16px, 1.2vw, 21px);
    line-height:1.55;
    margin-bottom:32px;
    max-width:34em;
  }
  .pro .btn-ghost{
    background:rgba(255,255,255,0.08);
    color:#fff;
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(8px);
  }
  .pro .btn-ghost:hover{
    background:rgba(255,255,255,0.16);
    border-color:rgba(255,255,255,0.4);
  }
  .pro-photo-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
  }
  .pro-photo-wrap::before{
    content:'';
    position:absolute;
    width:304px;height:304px;
    border-radius:50%;
    border:1.5px dashed rgba(232,160,127,0.35);
    pointer-events:none;
  }
  .pro-photo-wrap .photo{

<script data-goatcounter="https://pepa.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-ym-key]'); if(!el)return;
  if(window.goatcounter&&goatcounter.count){goatcounter.count({path:(el.getAttribute('data-ym-key')==='max'?'click-max':'click-tg'),title:'click',event:true});}
});
</script>

<script>
// Отправка целей Яндекс.Метрики по клику на кнопки с data-ym-key
// Название реальной цели берётся из window.YM_CONFIG.goals (см. настройки в <head>)
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-ym-key]');
  if (!el) return;
  var key = el.getAttribute('data-ym-key');
  var goal = window.YM_CONFIG.goals[key];
  if (goal && typeof ym === 'function') {
    ym(window.YM_CONFIG.counterId, 'reachGoal', goal);
  }
});
</script>
</body>
