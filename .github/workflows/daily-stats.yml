name: daily-stats
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Send GoatCounter digest to Telegram
        env:
          GOAT_TOKEN: ${{ secrets.GOAT_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import datetime, json, os, urllib.request
          BASE = 'https://pepa.goatcounter.com/api/v0'
          H = {'Authorization': 'Bearer ' + os.environ['GOAT_TOKEN'],
               'Content-Type': 'application/json'}
          def get(path):
              try:
                  req = urllib.request.Request(BASE + path, headers=H)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except Exception:
                  return None
          def num(x):
              try:
                  return int(x)
              except Exception:
                  return 0
          def items_of(obj):
              if isinstance(obj, dict) and isinstance(obj.get('stats'), list):
                  return obj['stats']
              if isinstance(obj, list):
                  return obj
              return []
          def top(obj, n=6):
              rows = []
              for s in items_of(obj)[:80]:
                  if not isinstance(s, dict):
                      continue
                  name = str(s.get('name', s.get('ref', s.get('path', '')))).strip()
                  c = num(s.get('count', s.get('daily', s.get('visits', 0))))
                  if c > 0 and name and name != '?':
                      rows.append('%s — %d' % (name, c))
              return rows[:n]
          today = datetime.date.today()
          start = (today - datetime.timedelta(days=2)).isoformat()
          end = today.isoformat()
          q = '?start=%s&end=%s' % (start, end)
          totals = get('/stats/total' + q) or {}
          byday, visits = {}, 0
          t = totals.get('total') if isinstance(totals, dict) else None
          if isinstance(t, dict) and 'count' in t:
              visits = num(t['count'])
          for s in items_of(totals):
              if isinstance(s, dict) and ('day' in s or 'date' in s):
                  d = str(s.get('day', s.get('date')))[:10]
                  c = num(s.get('count', s.get('daily', 0)))
                  byday[d] = byday.get(d, 0) + c
          if not visits:
              visits = sum(byday.values())
          hits = get('/stats/hits' + q)
          tg = mx = 0
          pages = []
          for s in items_of(hits):
              if not isinstance(s, dict):
                  continue
              p, c = str(s.get('path', '')), num(s.get('count'))
              if 'click-tg' in p:
                  tg += c
              elif 'click-max' in p:
                  mx += c
              elif c > 0 and p:
                  pages.append('%s — %d' % (p, c))
          lines = ['psychologai.ru — %s..%s' % (start[5:], end[5:]), '',
                   'Визиты: %d' % visits,
                   'Клики TG: %d' % tg, 'Клики MAX: %d' % mx]
          if byday:
              lines += ['', 'По дням:']
              for d in sorted(byday):
                  lines.append('%s: %d' % (d[5:], byday[d]))
          if pages:
              lines += ['', 'Страницы:'] + pages[:6]
          for title, candidates in [
                  ('Источники:', ['ref', 'refs', 'referrer', 'referrers']),
                  ('Браузеры:', ['browser', 'browsers']),
                  ('Системы:', ['system', 'systems', 'os']),
                  ('Страны:', ['location', 'locations', 'country', 'countries']),
                  ('Экраны:', ['size', 'sizes', 'screen', 'screens'])]:
              for rp in candidates:
                  rows = top(get('/stats/' + rp + q))
                  if rows:
                      lines += ['', title] + rows
                      break
          msg = '\n'.join(lines)
          import urllib.parse
          data = urllib.parse.urlencode(
              {'chat_id': os.environ['TG_CHAT_ID'], 'text': msg}).encode()
          urllib.request.urlopen(
              'https://api.telegram.org/bot' + os.environ['TG_BOT_TOKEN'] + '/sendMessage',
              data=data, timeout=30)
          print('sent')
          PYEOF
