name: daily-stats
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Send GoatCounter digest to Telegram
        env:
          GOAT_TOKEN: ${{ secrets.GOAT_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import datetime, json, os, urllib.request
          BASE = 'https://pepa.goatcounter.com/api/v0'
          H = {'Authorization': 'Bearer ' + os.environ['GOAT_TOKEN'],
               'Content-Type': 'application/json'}
          def get(path):
              try:
                  req = urllib.request.Request(BASE + path, headers=H)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except Exception:
                  return None
          def num(x):
              try:
                  return int(x)
              except Exception:
                  return 0
          def daymap(item):
              m = {}
              for s in (item.get('stats') or []):
                  if isinstance(s, dict) and 'day' in s:
                      m[str(s['day'])[:10]] = m.get(str(s['day'])[:10], 0) + num(s.get('daily', 0))
              return m
          def top(obj, n=6):
              rows = []
              lst = []
              if isinstance(obj, dict):
                  lst = obj.get('stats') or obj.get('refs') or []
              for s in (lst if isinstance(lst, list) else [])[:80]:
                  if not isinstance(s, dict):
                      continue
                  name = str(s.get('name', s.get('ref', s.get('path', '')))).strip()
                  c = num(s.get('count', s.get('daily', 0)))
                  if c > 0 and name and name != '?':
                      rows.append((name, c))
              return rows[:n]
          hits = get('/stats/hits') or {}
          items = hits.get('hits') if isinstance(hits, dict) else []
          items = [s for s in (items or []) if isinstance(s, dict)]
          alldays = sorted({d for it in items for d in daymap(it)})
          win = alldays[-3:] if alldays else []
          main = next((s for s in items if s.get('path') == '/' and not s.get('event')), None)
          clicks = {s.get('path'): s for s in items if s.get('event')}
          tg = clicks.get('click-tg', {})
          mx = clicks.get('click-max', {})
          tot = lambda it: num((it or {}).get('count', 0))
          dm = lambda it: daymap(it or {})
          vd, td, md = dm(main), dm(tg), dm(mx)
          wv = sum(vd.get(d, 0) for d in win)
          wt = sum(td.get(d, 0) for d in win)
          wm = sum(md.get(d, 0) for d in win)
          q = '?start=%s&end=%s' % (win[0], win[-1]) if win else ''
          camp = top(get('/stats/campaigns' + q)) if win else []
          scope = 'окно'
          if not camp:
              camp = top(get('/stats/campaigns'))
              scope = 'всего'
          ad = sum(c for _, c in camp)
          base_visits = wv if scope == 'окно' else tot(main)
          organic = max(0, base_visits - ad)
          rng = '%s..%s' % (win[0][5:], win[-1][5:]) if win else 'нет данных'
          lines = ['psychologai.ru — %s' % rng, '',
                   'Визиты: %d (без рекламы: %d)' % (base_visits, organic),
                   'Клики TG: %d (всего %d)' % (wt, tot(tg)),
                   'Клики MAX: %d (всего %d)' % (wm, tot(mx))]
          if camp:
              lines += ['', 'Кампании (%s):' % scope]
              lines += ['%s — %d' % (n, c) for n, c in camp]
          if win:
              lines += ['', 'По дням (визиты / TG / MAX):']
              for d in win:
                  lines.append('%s: %d / %d / %d' % (d[5:], vd.get(d, 0), td.get(d, 0), md.get(d, 0)))
          pages = []
          for s in items:
              p = str(s.get('path', ''))
              if p and not s.get('event') and p != '/' and num(s.get('count')) > 0:
                  pages.append('%s — %d' % (p, num(s.get('count'))))
          if pages:
              lines += ['', 'Страницы:'] + pages[:6]
          if win and main and main.get('path_id'):
              refs = top(get('/stats/hits/%s%s' % (main['path_id'], q)))
              if refs:
                  lines += ['', 'Источники:']
                  lines += ['%s — %d' % (n, c) for n, c in refs]
              for title, candidates in [
                      ('Браузеры:', ['browser', 'browsers']),
                      ('Системы:', ['system', 'systems', 'os']),
                      ('Страны:', ['location', 'locations', 'country', 'countries']),
                      ('Экраны:', ['size', 'sizes', 'screen', 'screens'])]:
                  for rp in candidates:
                      rows = top(get('/stats/' + rp + q))
                      if rows:
                          lines += ['', title]
                          lines += ['%s — %d' % (n, c) for n, c in rows]
                          break
          msg = '\n'.join(lines)
          import urllib.parse
          data = urllib.parse.urlencode(
              {'chat_id': os.environ['TG_CHAT_ID'], 'text': msg}).encode()
          urllib.request.urlopen(
              'https://api.telegram.org/bot' + os.environ['TG_BOT_TOKEN'] + '/sendMessage',
              data=data, timeout=30)
          print('sent')
          PYEOF
