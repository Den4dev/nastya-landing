name: daily-stats
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Send counters digest to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.parse
          NS = 'psychologai-ru'
          def get(counter):
              try:
                  with urllib.request.urlopen(
                          'https://api.counterapi.dev/v1/%s/%s' % (NS, counter),
                          timeout=30) as r:
                      return json.load(r).get('count', 0)
              except Exception:
                  return '?'
          visits = get('visits')
          tg = get('click-tg')
          mx = get('click-max')
          msg = ('psychologai.ru — счётчики (всего)\n\n'
                 'Визиты: %s\nКлики TG: %s\nКлики MAX: %s' % (visits, tg, mx))
          data = urllib.parse.urlencode(
              {'chat_id': os.environ['TG_CHAT_ID'], 'text': msg}).encode()
          urllib.request.urlopen(
              'https://api.telegram.org/bot' + os.environ['TG_BOT_TOKEN'] + '/sendMessage',
              data=data, timeout=30)
          print('sent')
          PYEOF
